appId: com.karaokepitch.studio
productName: KaraokePitch Studio
copyright: Copyright © 2026 KaraokePitch Studio
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asarUnpack:
  - "**/node_modules/youtubei.js/**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "${productName}-${version}-win-${arch}-${target}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KaraokePitch Studio
portable:
  artifactName: "${productName}-${version}-win-${arch}-portable.${ext}"
