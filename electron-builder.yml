appId: com.karaokepitch.studio
productName: KaraokePitch Studio
copyright: Copyright © 2026 KaraokePitch Studio
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - package.json
asarUnpack:
  - "**/node_modules/youtubei.js/**/*"
publish:
  - provider: github
    owner: sadeeshasathsara
    repo: karaokepitch-studio
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: "KaraokePitch-Studio-${version}-win-${arch}-setup.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KaraokePitch Studio
portable:
  artifactName: "KaraokePitch-Studio-${version}-win-${arch}-portable.${ext}"
